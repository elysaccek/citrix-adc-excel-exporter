<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Azure DevOps Modülü</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; }
        .table-container { max-height: 70vh; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 5px; background: white; }
        thead th { position: sticky; top: 0; background-color: #f1f3f5 !important; z-index: 1; border-bottom: 2px solid #dee2e6; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">🟢 Citrix NLB Raporlama & Denetim Paneli</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white fw-bold" href="/">Ana Sayfa</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-info text-white fw-bold">
                        Azure Sunucu Listesi Çek
                    </div>
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <select class="form-select" id="companySelect">
                                    <option value="" disabled selected>Lütfen Azure aktif bir şirket seçin...</option>
                                    {% for company in companies %}
                                    <option value="{{ company }}">{{ company }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <button type="button" class="btn btn-primary w-100 fw-bold" onclick="fetchAzureData()" id="btnFetch">Sunucuları Getir</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="table-container shadow-sm" id="resultContainer" style="display: none;">
                    <table class="table table-striped table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Server Name (Agent Adı)</th>
                                <th>Health Status</th>
                                <th>Azure Tags (Etiketler)</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                        </tbody>
                    </table>
                </div>
                <div id="loading" style="display: none;" class="text-center py-5">
                    <div class="spinner-border text-info" role="status">
                        <span class="visually-hidden">Yükleniyor...</span>
                    </div>
                    <p class="mt-2 text-muted fw-bold">Azure DevOps'a bağlanılıyor...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function fetchAzureData() {
            const company = document.getElementById('companySelect').value;
            if (!company) { alert("Önce listeden bir şirket seçmelisiniz."); return; }

            document.getElementById('btnFetch').disabled = true;
            document.getElementById('resultContainer').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            fetch('/api/azure_targets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ company: company })
            })
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('btnFetch').disabled = false;

                if (data.status === 'success') {
                    const tbody = document.getElementById('tableBody');
                    tbody.innerHTML = '';
                    
                    if (data.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3" class="text-center text-warning fw-bold py-3">Bu Deployment Group içerisinde hiçbir sunucu bulunamadı.</td></tr>';
                    } else {
                        data.data.forEach(item => {
                            let statusClass = item.HealthStatus.toLowerCase() === 'online' ? 'text-success' : 'text-danger';
                            let tr = `<tr>
                                <td class="fw-bold">${item.ServerName}</td>
                                <td class="${statusClass} fw-bold">${item.HealthStatus}</td>
                                <td>${item.Tags || '-'}</td>
                            </tr>`;
                            tbody.innerHTML += tr;
                        });
                    }
                    document.getElementById('resultContainer').style.display = 'block';
                } else {
                    alert("Hata: " + data.message);
                }
            })
            .catch(err => {
                alert("Bir ağ hatası oluştu.");
                document.getElementById('loading').style.display = 'none';
                document.getElementById('btnFetch').disabled = false;
            });
        }
    </script>
</body>
</html>
