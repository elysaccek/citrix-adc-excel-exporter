<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>{{ filename }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container-fluid py-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0 text-light">{{ filename }}</h4>
            <div>
                <a href="/download/{{ filename }}" class="btn btn-success btn-sm fw-bold">Excel İndir</a>
                <button onclick="window.close()" class="btn btn-outline-danger btn-sm fw-bold">Kapat</button>
            </div>
        </div>
        
        <ul class="nav nav-tabs" id="excelTabs" role="tablist">
            {% for sheet_name in sheets.keys() %}
            <li class="nav-item" role="presentation">
                <button class="nav-link {% if loop.first %}active{% endif %}" id="tab-btn-{{ loop.index }}" data-bs-toggle="tab" data-bs-target="#tab-pane-{{ loop.index }}" type="button" role="tab">
                    {{ sheet_name }}
                </button>
            </li>
            {% endfor %}
        </ul>
        
        <div class="tab-content" id="excelTabsContent">
            {% for sheet_name, table_html in sheets.items() %}
            <div class="tab-pane fade {% if loop.first %}show active{% endif %}" id="tab-pane-{{ loop.index }}" role="tabpanel">
                <div class='excel-table-container'>
                    {{ table_html | safe }}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
