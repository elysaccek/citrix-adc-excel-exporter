<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{{ filename }} - Görüntüleme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f3f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
        .excel-table-container {
            overflow: auto;
            background: #fff;
            max-height: 80vh;
            border: 1px solid #dee2e6;
            border-top: none;
        }
        .excel-table {
            border-collapse: collapse;
            font-size: 0.85rem;
            width: max-content; 
        }
        .excel-table td, .excel-table th {
            border: 1px solid #bfbfbf !important;
            padding: 8px 12px;
        }
        .excel-table tr:first-child td {
            position: sticky;
            top: 0;
            z-index: 2;
            box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.4);
        }
        .nav-tabs .nav-link {
            font-weight: bold;
            color: #495057;
            background-color: #e9ecef;
            border-color: #dee2e6;
            margin-right: 2px;
        }
        .nav-tabs .nav-link.active {
            color: #198754;
            background-color: #fff;
            border-bottom-color: #fff;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0 text-dark">📊 {{ filename }}</h4>
            <div>
                <a href="/download/{{ filename }}" class="btn btn-success btn-sm fw-bold">⬇️ Excel İndir</a>
                <button onclick="window.close()" class="btn btn-outline-danger btn-sm fw-bold">❌ Kapat</button>
            </div>
        </div>
        
        <ul class="nav nav-tabs" id="excelTabs" role="tablist">
            {% for sheet_name in sheets.keys() %}
            <li class="nav-item" role="presentation">
                <button class="nav-link {% if loop.first %}active{% endif %}" id="tab-btn-{{ loop.index }}" data-bs-toggle="tab" data-bs-target="#tab-pane-{{ loop.index }}" type="button" role="tab">
                    📝 {{ sheet_name }}
                </button>
            </li>
            {% endfor %}
        </ul>
        
        <div class="tab-content bg-white" id="excelTabsContent">
            {% for sheet_name, table_html in sheets.items() %}
            <div class="tab-pane fade {% if loop.first %}show active{% endif %}" id="tab-pane-{{ loop.index }}" role="tabpanel">
                <div class='excel-table-container'>
                    {{ table_html | safe }}
                </div>
            </div>
            {% endfor %}
        </div>
        
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
